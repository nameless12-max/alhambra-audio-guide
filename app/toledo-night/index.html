<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Toledo Night Legends</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../toledo/icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --gold:#e3b341; --blue:#2f81f7; --legend:#f0c987; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
  #map { position:fixed; inset:0 0 42vh 0; background:#111; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .leaflet-container { background:#111; }
  .leaflet-control-attribution { background:rgba(13,17,23,.8)!important; color:var(--muted)!important; }
  .leaflet-control-attribution a { color:#9cc3ff!important; }
  .pin { width:34px; height:34px; border-radius:50%; background:var(--gold); color:#000; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #000; box-shadow:0 0 0 2px var(--gold); font-size:15px; }
  .pin.extra { background:#6e7681; color:#fff; box-shadow:0 0 0 2px #6e7681; }
  .pin.here { background:#3fb950; box-shadow:0 0 0 3px #3fb950, 0 0 14px #3fb950; }
  .me { width:18px; height:18px; border-radius:50%; background:var(--blue); border:3px solid #fff; box-shadow:0 0 10px var(--blue); }
  #locate { position:fixed; right:12px; bottom:calc(42vh + 12px); z-index:1000; height:48px; padding:0 16px; border-radius:24px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:16px; }
  #sheet { position:fixed; left:0; right:0; bottom:0; height:42vh; background:var(--panel); border-top:1px solid var(--line); overflow-y:auto; z-index:1000; padding-bottom:env(safe-area-inset-bottom); }
  #status { padding:8px 16px; font-size:14px; color:var(--muted); border-bottom:1px solid var(--line); }
  #status.warn { color:#ffa198; }
  .row { display:flex; align-items:center; gap:12px; min-height:60px; padding:8px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:active { background:#1f2630; }
  .row .num { flex:0 0 34px; }
  .row .name { flex:1; }
  .row .name small { display:block; color:var(--muted); font-size:13px; }
  .row .dist { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row.here { background:#12321c; }
  .row.here .dist { color:#3fb950; font-weight:700; }
  .row.start .num { background:var(--blue); color:#fff; box-shadow:0 0 0 2px var(--blue); }
  #story { position:fixed; inset:0; background:var(--bg); z-index:2000; overflow-y:auto; display:none; padding:0 18px 40px; }
  #story.open { display:block; }
  #story header { position:sticky; top:0; background:var(--bg); padding:12px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start; }
  #story h1 { font-size:20px; margin:0; flex:1; }
  #close { flex:0 0 48px; height:48px; border-radius:24px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:22px; }
  .where { color:var(--muted); margin:12px 0; }
  audio { width:100%; margin:8px 0 16px; }
  .p { margin:0 0 14px; }
  .p.A { color:var(--legend); font-style:italic; border-left:3px solid var(--legend); padding-left:12px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:#3d2f00; color:var(--gold); margin-bottom:8px; }
  .nav { display:inline-block; margin:4px 0 14px; color:#9cc3ff; }
</style>
</head>
<body>
<div id="map"></div>
<button id="locate" type="button">◎ Locate me</button>
<div id="sheet">
  <div id="status">Finding your position…</div>
  <div id="list"></div>
</div>
<div id="story" role="dialog" aria-modal="true">
  <header><h1 id="s-title"></h1><button id="close" type="button" aria-label="Close">✕</button></header>
  <div id="s-body"></div>
</div>

<script>
// ---- Audio legend pins (stories come from ../toledo/tracks.json). Sources: COORDS.md ----
const AUDIO_PINS = {
  'l01-cristo-de-la-luz':    { lat: 39.86060, lon: -4.02418, where: 'Mezquita del Cristo de la Luz, Calle Cristo de la Luz, by the Puerta del Sol gate' },
  'l02-cave-of-hercules':    { lat: 39.85865, lon: -4.02430, where: 'Cuevas de Hércules, Callejón de San Ginés' },
  'l03-school-of-magic':     { lat: 39.85663, lon: -4.02401, where: 'Approximate: outside the cathedral, Calle Cardenal Cisneros (the tale has no fixed spot)' },
  'l04-bitter-well':         { lat: 39.85502, lon: -4.02352, where: 'Approximate: Calle del Pozo Amargo (lane midpoint)' },
  'l05-cristo-de-la-vega':   { lat: 39.86094, lon: -4.03422, where: 'Ermita del Cristo de la Vega, Paseo Cristo de la Vega, outside the walls' },
  'l06-becquer-the-kiss':    { lat: 39.85796, lon: -4.02725, where: 'Church of San Pedro Mártir, Calle San Román (San Clemente is next door)' },
  'l07-hombre-de-palo':      { lat: 39.85793, lon: -4.02398, where: 'Approximate: Calle del Hombre de Palo (lane midpoint)' },
  'l08-christ-of-the-skull': { lat: 39.85683, lon: -4.02153, where: 'Approximate: Calle del Cristo de la Calavera (lane midpoint)' }
};

// ---- Extra text-only legend pins. Edit freely. ----
const EXTRAS = [
  { id: 'x1', title: 'Plaza de Zocodover: market and fire', lat: 39.85948, lon: -4.02142,
    where: 'Plaza de Zocodover, the main square',
    text: 'The name comes from the Arabic for "market of the beasts", and for centuries this was where Toledo bought its horses, bread and gossip. But the square had a darker trade. Here the Inquisition staged its autos-da-fé: crowds packed the balconies, the condemned walked in yellow penitent robes, and sentences were read aloud before the city. Bullfights, executions and fairs all shared these same stones. Legend says that on quiet nights you can still hear the murmur of a crowd that is no longer there.' },
  { id: 'x2', title: 'The Virgin of the Little Pins', lat: 39.85983, lon: -4.02324,
    where: 'Virgen de los Alfileritos, a niche on Calle Alfileritos',
    text: 'In a glass niche on this narrow lane, a few steps from Zocodover, stands a small Virgin among candles and flowers. The best-loved version of her legend tells of Doña Soledad de Vargas, a young woman who came here to pray for love. Each time she prayed, she pushed a pin through the little grille as her offering. Others say the pins were meant to bring an absent lover home. Either way, the custom never died: Toledans still leave a pin here when they ask for a sweetheart. Look closely and you will see them, bright in the candlelight.' },
  { id: 'x3', title: 'The Cobertizos: lanes under houses', lat: 39.86055, lon: -4.02571,
    where: 'Approximate: Cobertizo de Santo Domingo el Real (lane midpoint)',
    text: 'A cobertizo is a lane that runs under the houses, roofed over by rooms built across the street. These tunnels were the darkest places in the old city, and Toledans filled them with stories. Night walkers spoke of footsteps that followed and then stopped, of cloaked figures that vanished at the far arch, and of lovers who met here because no window could see them. Walk through slowly. At night the vaults swallow sound, and every footstep seems to arrive a little late.' },
  { id: 'x4', title: 'Santo Domingo el Real: Bécquer\'s square', lat: 39.86048, lon: -4.02632,
    where: 'Plaza de Santo Domingo el Real, in front of the convent',
    text: 'The Romantic poet Gustavo Adolfo Bécquer came to Toledo in the 1850s and walked its lanes at night, and this small, silent square below the enclosed convent of Santo Domingo el Real was one of his haunts. High blind walls, barred windows, a bell, and nuns who are heard but never seen: it is the stage set of his legends. In them, a stranger glimpses a pale hand behind a convent grille, or follows a woman into a lane that ends in nothing. Stand still here after dark. The square has hardly changed since he stood in it.' },
  { id: 'x5', title: 'The Baño de la Cava: La Cava\'s bath', lat: 39.85809, lon: -4.03466,
    where: 'Torreón del Baño de la Cava, by the river near the San Martín bridge',
    text: 'This ruined tower by the Tagus is tied to the last Visigothic king, Rodrigo. Legend says he watched from a window as Florinda, called La Cava, bathed in the river here, and he took her by force. Her father, Count Julián, governor of Ceuta, swore revenge and opened the straits to the Muslim armies in 711. So, the story goes, Spain was lost for a bath. Historians doubt every word, and the tower is really part of an old bridge. But the name has stuck for a thousand years, and on dark nights the river here is very loud.' }
];

const map = L.map('map', { zoomControl: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

let spots = [], intro = null, me = null, meMarker = null, meCircle = null, follow = true;

const pinIcon = (label, cls) => L.divIcon({ className: '', html: `<div class="pin ${cls}">${label}</div>`, iconSize: [34, 34], iconAnchor: [17, 17] });

function distM(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmt = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function paragraphs(segments) {
  const out = [];
  for (const s of segments) {
    const last = out[out.length - 1];
    if (last && last.p === s.p) last.text += ' ' + s.text;
    else out.push({ p: s.p, who: s.who, text: s.text });
  }
  return out;
}

function openStory(s) {
  document.getElementById('s-title').textContent = s.title;
  let html = `<span class="tag">${s.extra ? 'Legend · text only' : 'Legend · audio'}</span>`;
  html += `<div class="where">📍 ${esc(s.where)}</div>`;
  if (s.lat) {
    const d = me ? ' (' + fmt(distM(me, s)) + ' away)' : '';
    html += `<a class="nav" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${s.lat},${s.lon}" target="_blank" rel="noopener">Walking directions${d}</a>`;
  }
  if (s.audio) html += `<audio controls preload="none" src="${esc(s.audio)}"></audio>`;
  if (s.paras) html += s.paras.map(p => `<p class="p ${p.who === 'A' ? 'A' : ''}">${esc(p.text)}</p>`).join('');
  else html += `<p class="p A">${esc(s.text)}</p>`;
  document.getElementById('s-body').innerHTML = html;
  document.getElementById('story').classList.add('open');
  document.getElementById('story').scrollTop = 0;
}
document.getElementById('close').onclick = () => {
  const a = document.querySelector('#s-body audio'); if (a) a.pause();
  document.getElementById('story').classList.remove('open');
};

function render() {
  let nearest = null;
  for (const s of spots) {
    s.d = me ? distM(me, s) : null;
    if (me && (!nearest || s.d < nearest.d)) nearest = s;
  }
  const here = nearest && nearest.d <= 40 ? nearest : null;
  const sorted = me ? [...spots].sort((a, b) => a.d - b.d) : spots;
  const list = document.getElementById('list');
  list.innerHTML = '';
  const row = (s, num, cls, sub, dist) => {
    const el = document.createElement('div');
    el.className = 'row ' + cls;
    el.innerHTML = `<div class="pin num ${s.extra ? 'extra' : ''} ${cls === 'here' ? 'here' : ''}">${num}</div><div class="name">${esc(s.title)}<small>${esc(sub)}</small></div><div class="dist">${dist}</div>`;
    el.onclick = () => openStory(s);
    list.appendChild(el);
  };
  if (intro) row(intro, '▶', 'start', 'Start here: introduction, listen anywhere', '');
  for (const s of sorted) {
    const isHere = s === here;
    row(s, s.label, isHere ? 'here' : '', isHere ? 'You are here' : s.where, s.d == null ? '' : fmt(s.d));
    s.marker.setIcon(pinIcon(s.label, (s.extra ? 'extra ' : '') + (isHere ? 'here' : '')));
  }
}

function setStatus(msg, warn) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = warn ? 'warn' : '';
}

function onPos(p) {
  me = { lat: p.coords.latitude, lon: p.coords.longitude };
  const ll = [me.lat, me.lon];
  if (!meMarker) {
    meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 }).addTo(map);
    meCircle = L.circle(ll, { radius: p.coords.accuracy, color: '#2f81f7', weight: 1, fillOpacity: .12 }).addTo(map);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(p.coords.accuracy); }
  if (follow) { map.setView(ll, Math.max(map.getZoom(), 16)); follow = false; }
  setStatus(`Your position: ±${Math.round(p.coords.accuracy)} m. Nearest legends first.`);
  render();
}
function onErr(e) {
  if (e.code === 1) setStatus('Location permission denied. Allow location for this site in Chrome settings (lock icon › Permissions), then tap Locate me.', true);
  else setStatus('Cannot get your position yet (' + e.message + '). Keep the screen on and try Locate me.', true);
}
let watchId = null;
function startWatch() {
  if (!navigator.geolocation) { setStatus('This browser has no geolocation.', true); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
document.getElementById('locate').onclick = () => { follow = true; if (me) map.setView([me.lat, me.lon], 17); startWatch(); };

function addSpot(s) {
  s.marker = L.marker([s.lat, s.lon], { icon: pinIcon(s.label, s.extra ? 'extra' : '') }).addTo(map).on('click', () => openStory(s));
  spots.push(s);
}

async function init() {
  let tracks = [];
  try {
    const r = await fetch('../toledo/tracks.json');
    tracks = (await r.json()).tracks.filter(t => t.group === 'Legends');
  } catch (e) { setStatus('Could not load the audio stories. Text-only legends still work.', true); }
  for (const t of tracks) {
    const s = { title: t.title, audio: '../toledo/' + t.file, paras: paragraphs(t.segments) };
    if (t.id.startsWith('l00')) { intro = Object.assign(s, { where: t.room }); continue; }
    const pin = AUDIO_PINS[t.id];
    if (!pin) continue;
    addSpot(Object.assign(s, pin, { label: t.id.slice(2, 3) }));
  }
  EXTRAS.forEach((x, i) => addSpot(Object.assign({}, x, { extra: true, label: String.fromCharCode(65 + i) })));
  map.fitBounds(L.latLngBounds(spots.map(s => [s.lat, s.lon])), { padding: [30, 30] });
  render();
  startWatch();
}
window.addEventListener('resize', () => map.invalidateSize());
init();
</script>
</body>
</html>
