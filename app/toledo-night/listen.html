<!doctype html>
<!--
  Old address of the live translator. Translation now lives in index.html (switch at the top).
  The setup link listen.html#k=<key> still works: the key is stored on this device, then the page
  forwards to index.html#translate with the history entry replaced, so the key leaves the address bar
  and the back history. The microphone is not started until the user taps the switch.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>Toledo Night Legends</title>
<style>html,body{margin:0;background:#0d1117;color:#e6edf3;font:17px/1.45 system-ui,sans-serif}p{padding:24px 16px}a{color:#e3b341}</style>
<script>
try {
  var m = location.hash.match(/^#k=(.+)$/);
  if (m) {
    var k = decodeURIComponent(m[1]).trim();
    if (k) localStorage.setItem('toledoListen.apiKey', JSON.stringify(k));
  }
} catch (e) {}
location.replace('index.html#translate');
</script>
</head>
<body>
<p>Opening the app… <a href="index.html#translate">Tap here if nothing happens.</a></p>
</body>
</html>
